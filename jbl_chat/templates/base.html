{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JBL Chat messaging application" />
    <meta name="keywords" content="chat, messaging" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>
      {% block title %}
        JBL Chat
      {% endblock title %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{% static 'chat/css/custom.css' %}" rel="stylesheet" />
    <!-- HTMX JS -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
            integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
            crossorigin="anonymous"></script>
    {% block extra_css %}
    {% endblock extra_css %}
  </head>
  <body>
    <nav class="navbar bg-primary text-white mb-4">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand text-white" href="{% url 'chat:home' %}">JBL Chat</a>
        <div class="d-flex align-items-center justify-content-center">{% include "partials/_nav_user.html" %}</div>
      </div>
    </nav>
    <div class="container">
      {% block content %}
      {% endblock content %}
    </div>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}
    {% endblock extra_js %}
  </body>
</html>
