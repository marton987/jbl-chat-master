{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JBL Chat messaging application" />
    <meta name="keywords" content="chat, messaging" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>
      {% block title %}
        JBL Chat
      {% endblock title %}
    </title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4="
          crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          integrity="sha256-pdY4ejLKO67E0CM2tbPtq1DJ3VGDVVdqAR6j3ZwdiE4="
          crossorigin="anonymous">
    <link href="{% static 'chat/css/custom.css' %}" rel="stylesheet" />
    <!-- HTMX JS -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
            integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
            crossorigin="anonymous"></script>
    {% block extra_css %}
    {% endblock extra_css %}
  </head>
  <body>
    <nav class="navbar bg-primary text-white mb-4">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-light btn-sm"
                  type="button"
                  data-bs-toggle="offcanvas"
                  data-bs-target="#contactsDrawer"
                  aria-controls="contactsDrawer"
                  title="View contacts">
            <i class="bi bi-people-fill"></i>
            <span class="d-none d-md-inline ms-1">Contacts</span>
          </button>
          <a class="navbar-brand text-white" href="{% url 'chat:home' %}">JBL Chat</a>
        </div>
        <div class="d-flex align-items-center justify-content-center">{% include "partials/_nav_user.html" %}</div>
      </div>
    </nav>
    <div class="container">
      {% block content %}
      {% endblock content %}
    </div>
    {% block drawer %}
    {% endblock drawer %}
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha256-ew8UiV1pJH/YjpOEBInP1HxVvT/SfrCmwSoUzF9JIgc="
            crossorigin="anonymous"></script>
    {% block extra_js %}
    {% endblock extra_js %}
  </body>
</html>
