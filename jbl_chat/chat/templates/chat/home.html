{% extends "base.html" %}
{% load static %}
{% block title %}
  Chats - JBL Chat
{% endblock title %}
{% block extra_css %}
  <link href="{% static 'chat/css/custom.css' %}" rel="stylesheet" />
{% endblock extra_css %}
{% block content %}
  <div class="row">
    <div class="col-12">
      <h1 class="mb-4">Chats</h1>
      <!-- Chats List Container (will be updated via HTMX) -->
      <div id="chats-list-container">
        <div id="chats-list-indicator" class="text-center my-3">
          <span class="spinner-border spinner-border-sm text-primary d-none"
                role="status"
                aria-hidden="true"></span>
        </div>
        <div id="chats-list"
             hx-get="{% url 'chat:conversations' %}"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML"
             hx-indicator="#chats-list-indicator">
          <!-- Chats list will be loaded here via HTMX -->
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
