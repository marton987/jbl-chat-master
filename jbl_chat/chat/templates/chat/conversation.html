{% extends "base.html" %}
{% block title %}
    Conversation with {{ other_user.username }} - JBL Chat
{% endblock title %}
{% block content %}
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Conversation with @{{ other_user.username }}</h1>
                <a href="{% url 'chat:home' %}" class="btn btn-secondary">Back to Users</a>
            </div>
            <!-- Messages container with HTMX for scroll-based pagination -->
            <div id="message-list-container" class="mb-4">
                <div id="message-list-indicator" class="text-center mb-3">
                    <div class="spinner-border spinner-border-sm text-primary htmx-indicator"
                         role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div id="message-scroll-container" class="message-scroll-container">
                    <div id="load-more-button-container"
                         class="text-center py-2 mb-3 load-more-container">
                        <!-- Load more button will be updated via out-of-band swaps -->
                    </div>
                    <div id="message-list"
                         hx-get="{% url 'chat:conversation' other_user.username %}"
                         hx-trigger="load"
                         hx-target="this"
                         hx-swap="innerHTML"
                         hx-indicator="#message-list-indicator">
                        <!-- Messages will be loaded here via HTMX -->
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
