<!-- Load more button is updated via out-of-band swap to #load-more-button-container in conversation.html -->
<div class="messages-container">
  {% if messages %}
    {% for message in messages %}
      {% include "chat/partials/_single_message.html" with message=message current_user=current_user %}
    {% endfor %}
  {% else %}
    <div class="alert alert-info" role="alert">
      <h4 class="alert-heading">No messages yet</h4>
      <p class="mb-0">Start the conversation by sending a message to {{ other_user.username }}!</p>
    </div>
  {% endif %}
  <!-- SSE message listener: swap into messages-container for proper ordering -->
  <!-- sse-swap must be on a child of the element with hx-ext="sse" and sse-connect -->
  <!-- This div is inside .messages-container which is inside #message-list which is inside the SSE connection div -->
  <div sse-swap="message"
       hx-target=".messages-container"
       hx-swap="beforeend"></div>
</div>
