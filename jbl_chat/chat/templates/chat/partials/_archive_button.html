<form id="archive-form"
      hx-post="{% if is_archived %}{% url 'chat:unarchive_conversation' other_user.username %}{% else %}{% url 'chat:archive_conversation' other_user.username %}{% endif %}"
      hx-target="#archive-form"
      hx-swap="outerHTML"
      class="d-inline">
    {% csrf_token %}
    <button id="archive-btn"
            type="submit"
            class="btn {% if is_archived %}btn-outline-primary{% else %}btn-outline-secondary{% endif %}"
            title="{% if is_archived %}Unarchive{% else %}Archive{% endif %} conversation">
        <i class="bi bi-archive"></i>
        {% if is_archived %}
            Unarchive
        {% else %}
            Archive
        {% endif %}
    </button>
</form>
