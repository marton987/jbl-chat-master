{% if has_older_messages %}
  <button class="btn btn-outline-primary btn-sm load-more-trigger"
          data-action="load-more-messages"
          hx-get="{% url 'chat:load_more_messages' other_user.username %}?page={{ next_page }}"
          hx-target=".messages-container"
          hx-swap="afterbegin"
          hx-indicator=".load-more-indicator">
    <span class="load-more-indicator htmx-indicator spinner-border spinner-border-sm me-2"
          role="status"
          aria-label="Loading older messages"></span>
    <span class="htmx-indicator">Loading...</span>
    <span class="load-more-text">Load Older Messages</span>
  </button>
{% else %}
  <div class="text-muted small">No older messages</div>
{% endif %}
