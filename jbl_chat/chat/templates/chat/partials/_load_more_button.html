{% if has_older_messages %}
  <button class="btn btn-outline-primary btn-sm load-more-trigger"
          hx-post="{% url 'chat:conversation' other_user.username %}"
          hx-target="#message-list"
          hx-swap="afterbegin"
          hx-vals='{"page": {{ next_page }}, "csrfmiddlewaretoken": "{{ csrf_token }}" }'
          hx-indicator=".load-more-indicator">
    <span class="load-more-indicator htmx-indicator spinner-border spinner-border-sm me-2"
          role="status">
      <span class="visually-hidden">Loading...</span>
    </span>
    Load Older Messages
  </button>
{% else %}
  <div class="text-muted small">No older messages</div>
{% endif %}
