# fly.toml app configuration file generated for jbl-chat-master on 2025-12-06T13:13:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jbl-chat-master'
primary_region = 'fra'
console_command = '/code/jbl_chat/manage.py shell'

[build]

[env]
  PORT = '8000'
  DEBUG = 'True'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Persistent volume for database
[[mounts]]
  source = "db_data"
  destination = "/data"

# Static files are handled by Django's staticfiles app
# No need for [[statics]] section - Django will serve them via /static/ URL
